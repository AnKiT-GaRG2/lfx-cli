---
GITHUB_COMMENT_REPORTER: false
# Excludes locally generated CLI binaries from repository scans.
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - bin
DISABLE_LINTERS:
  # yamllint is sufficient for us.
  - YAML_PRETTIER
DISABLE_ERRORS_LINTERS:
  # There's no easy local feedback loop for spelling issues before
  # pushing, so keep them non-blocking to avoid unnecessary PR cycles
  # for words that just need adding to the dictionary.
  - SPELL_CSPELL
YAML_YAMLLINT_CONFIG_FILE: .yamllint
SPELL_CSPELL_ANALYZE_FILE_NAMES: false
SPELL_CSPELL_PRE_COMMANDS:
  - command: >-
      cp .cspell.json /tmp/cspell.json.orig &&
      curl -sSf --connect-timeout 5 --max-time 15 https://raw.githubusercontent.com/linuxfoundation/lfx-public-workflows/737873e045a02df2f66b09d8061b98997cdf1880/cspell/flagwords.json.snippet -o /tmp/flagwords.json.snippet &&
      test "$(grep -c '^[[:space:]]*"flagWords"[[:space:]]*:[[:space:]]*\[\],[[:space:]]*$' .cspell.json)" -eq 1 &&
      sed -i -e '/^[[:space:]]*"flagWords"[[:space:]]*:[[:space:]]*\[\],[[:space:]]*$/{r /tmp/flagwords.json.snippet' -e 'd}' .cspell.json
    cwd: workspace
    continue_if_failed: false
SPELL_CSPELL_POST_COMMANDS:
  - command: cp /tmp/cspell.json.orig .cspell.json
    cwd: workspace
# Allows Grype to complete repository scans over Docker bind mounts.
REPOSITORY_GRYPE_TIMEOUT_SECONDS: 600
# Ignore YAML files with templating macros; these typically fail linting and/or
# schema checking.
FILTER_REGEX_EXCLUDE: '(templates/.*\.yml|templates/.*\.yaml)'
